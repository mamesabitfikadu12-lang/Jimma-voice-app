name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jimma_voice_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: rm -rf android && flutter create --platforms=android . --org com.jimmavoice --project-name jimma_voice_app && sed -i "s/minSdk = flutter.minSdkVersion/minSdk = 23/g" android/app/build.gradle.kts && sed -i "s/android:label=\"[^\"]*\"/android:label=\"Jimma Voice Chat Family\"/g" android/app/src/main/AndroidManifest.xml && flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        with:
          name: jimma-voice-apk
          path: jimma_voice_app/build/app/outputs/flutter-apk/app-release.apk
