name: Build Jimma Voice PWA & APK
on: [push]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Backup Custom Code
        run: mkdir -p /tmp/lib_bak && cp jimma_voice_app/lib/*.dart /tmp/lib_bak/
      - name: Fresh Clean Project
        run: rm -rf jimma_voice_app && flutter create jimma_voice_app --project-name jimma_voice_app --org com.jimma.voice
      - name: Restore Custom Code & Build PWA + APK
        run: |
          cp /tmp/lib_bak/*.dart jimma_voice_app/lib/
          cd jimma_voice_app
          flutter build web --release --base-href "/Jimma-voice-app/"
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jimma-voice-apk
          path: jimma_voice_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Deploy PWA to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./jimma_voice_app/build/web
