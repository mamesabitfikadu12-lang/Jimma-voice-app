name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jimma_voice_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: chmod 444 android/build.gradle.kts && sed -i "s/flutter\.compileSdkVersion/35/g; s/flutter\.minSdkVersion/23/g; s/flutter\.targetSdkVersion/35/g" ~/.pub-cache/hosted/pub.dev/android_file_picker-*/android/build.gradle.kts && flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        with:
          name: jimma-voice-apk
          path: jimma_voice_app/build/app/outputs/flutter-apk/app-release.apk
