name: Build Ethio Voice Android APK & Play Store AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure App Name, ZegoVoice, Audio Assets & Build
        run: |
          cd jimma_voice_app
          flutter create --org com.jimmavoice --project-name app .
          mkdir -p assets/sounds
          python3 -c 'import wave,struct,math; make=lambda p,fs,d: (w:=wave.open(p,"w"),w.setnchannels(1),w.setsampwidth(2),w.setframerate(22050),w.writeframes(b"".join(struct.pack("<h",int(16000*math.sin(2*math.pi*fs[int(i*len(fs)/(22050*d))]*i/22050)*(1-i/(22050*d)))) for i in range(int(22050*d)))),w.close()); make("assets/sounds/coin.wav",[988,1319],0.18); make("assets/sounds/gift.wav",[523,659,784,1047],0.42); make("assets/sounds/win.wav",[523,659,784,1047,1319],0.55); make("assets/sounds/notify.wav",[880],0.12)'
          cat << 'EOF' > pubspec.yaml
          name: jimma_voice_app
          description: Voice Chat ET Official App
          publish_to: 'none'
          version: 3.0.0+3
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            http: ^1.2.0
            socket_io_client: ^2.0.3+1
            image_picker: ^1.1.2
            audioplayers: ^6.1.0
            zego_express_engine: ^3.18.0
            permission_handler: ^11.3.1
          flutter:
            uses-material-design: true
            assets:
              - assets/sounds/
          EOF
          sed -i 's/android:label="[^"]*"/android:label="Voice Chat ET"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android {/android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' android/app/build.gradle.kts
          flutter pub get
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/compileSdkVersion 31/compileSdkVersion 35/g; s/compileSdk = 31/compileSdk = 35/g' {} + || true
          flutter build apk --release
          flutter build appbundle --release
          zip -d build/app/outputs/bundle/release/app-release.aab "META-INF/*" || true
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ../voice_et_release.jks -storepass VoiceET2026 -keypass VoiceET2026 build/app/outputs/bundle/release/app-release.aab voiceet

      - name: Upload APK & Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: ethio-voice-playstore-release
          path: |
            jimma_voice_app/build/app/outputs/flutter-apk/app-release.apk
            jimma_voice_app/build/app/outputs/bundle/release/app-release.aab
