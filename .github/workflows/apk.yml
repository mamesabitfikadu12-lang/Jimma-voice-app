name: Build Ethio-Voice Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure App Name, SDK 37, Audio Assets & Build
        run: |
          cd jimma_voice_app
          mkdir -p assets/sounds
          python3 -c "
          import wave, struct, math
          def make_wav(path, freqs, dur=0.14):
              with wave.open(path, 'w') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(22050)
                  for f in freqs:
                      for i in range(int(22050 * dur)):
                          val = int(28000 * math.sin(2 * math.pi * f * i / 22050) * (1 - i / (22050 * dur)))
                          w.writeframes(struct.pack('<h', val))
          make_wav('assets/sounds/spin.wav',, 0.07)
          make_wav('assets/sounds/win.wav',, 0.14)
          make_wav('assets/sounds/bigwin.wav',, 0.18)
          make_wav('assets/sounds/jackpot.wav',, 0.22)
          "
          cat << 'EOF' > pubspec.yaml
          name: jimma_voice_app
          description: Jimma Voice Chat Family Official App
          publish_to: 'none'
          version: 3.0.0+3
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            http: ^1.2.0
            socket_io_client: ^2.0.3+1
            image_picker: ^1.1.2
            audioplayers: ^6.1.0
          flutter:
            uses-material-design: true
            assets:
              - assets/sounds/
          EOF
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload APK & Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: ethio-voice-playstore-release
          path: |
            jimma_voice_app/build/app/outputs/flutter-apk/app-release.apk
            jimma_voice_app/build/app/outputs/bundle/release/app-release.aab
