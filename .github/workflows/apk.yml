name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          cd jimma_voice_app
          flutter pub get
          chmod 444 android/build.gradle.kts
          for f in ~/.pub-cache/hosted/pub.dev/android_file_picker-*/android/build.gradle.kts; do
            printf 'plugins {\n  id("com.android.library")\n  id("org.jetbrains.kotlin.android")\n}\nandroid {\n  namespace = "com.mr.flutter.plugin.filepicker"\n  compileSdk = 35\n  defaultConfig { minSdk = 23 }\n  compileOptions {\n    sourceCompatibility = JavaVersion.VERSION_17\n    targetCompatibility = JavaVersion.VERSION_17\n  }\n  \n}\n' > "$f"
          done
          flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        with:
          name: jimma-voice-apk
          path: jimma_voice_app/build/app/outputs/flutter-apk/app-release.apk
