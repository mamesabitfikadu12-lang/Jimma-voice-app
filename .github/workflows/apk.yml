name: Build Jimma Voice APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          cp jimma_voice_app/lib/main.dart /tmp/main.dart
          cp jimma_voice_app/pubspec.yaml /tmp/pubspec.yaml
          rm -rf jimma_voice_app
          flutter create --org com.jimmavoice --platforms=android jimma_voice_app
          cp /tmp/main.dart jimma_voice_app/lib/main.dart
          cp /tmp/pubspec.yaml jimma_voice_app/pubspec.yaml
          cd jimma_voice_app
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g; s/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g; s/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle.kts
          sed -i 's/android:label="[^"]*"/android:label="Jimma Voice Chat Family"/g' android/app/src/main/AndroidManifest.xml
          flutter pub get
          for f in ~/.pub-cache/hosted/pub.dev/android_file_picker-*/android/build.gradle*; do
            [ -f "$f" ] && printf 'plugins {\n  id("com.android.library")\n  id("org.jetbrains.kotlin.android")\n}\nandroid {\n  namespace = "com.mr.flutter.plugin.filepicker"\n  compileSdk = 35\n  defaultConfig { minSdk = 23 }\n  compileOptions {\n    sourceCompatibility = JavaVersion.VERSION_17\n    targetCompatibility = JavaVersion.VERSION_17\n  }\n}\n' > "$f"
          done
          flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: jimma-voice-apk
          path: jimma_voice_app/build/app/outputs/flutter-apk/app-release.apk
