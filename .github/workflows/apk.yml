name: Build Ethio Voice Android APK & Play Store AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure App Name, ZegoVoice, Audio Assets & Build
        run: |
          cd jimma_voice_app
          flutter create --org com.jimmavoice --project-name app .
          for d in android/app/src/main/res/mipmap-*; do cp ../voice_et_icon_512.png "$d/ic_launcher.png" 2>/dev/null || true; done
          mkdir -p assets/sounds
          python3 -c "import wave,struct,math; [ (lambda p,fs,d: (lambda w: (w.setnchannels(1),w.setsampwidth(2),w.setframerate(22050),w.writeframes(b''.join(struct.pack('<h',int(16000*math.sin(2*math.pi*fs[int(i*len(fs)/(22050*d))]*i/22050)*(1-i/(22050*d)))) for i in range(int(22050*d)))),w.close()))(wave.open(p,'w')))(*x) for x in [('assets/sounds/coin.wav',(880,1320),0.18),('assets/sounds/gift.wav',(523,659,784,1046),0.42),('assets/sounds/win.wav',(587,740,880,1174),0.55),('assets/sounds/notify.wav',(987,1318),0.12)] ]"
          cat << 'EOF' > pubspec.yaml
          name: jimma_voice_app
          description: Voice Chat ET Official App
          publish_to: 'none'
          version: 3.0.6+9

          environment:
            sdk: '>=3.4.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            http: ^1.2.0
            socket_io_client: ^2.0.3+1
            image_picker: ^1.1.2
            audioplayers: ^6.1.0
            zego_express_engine: ^3.18.0
            permission_handler: ^11.3.1
            shared_preferences: ^2.3.2
            webview_flutter: ^4.10.0

          flutter:
            uses-material-design: true
            assets:
              - assets/sounds/
          EOF
          sed -i 's/android:label="[^"]*"/android:label="Voice Chat ET"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android {/android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' android/app/build.gradle.kts || true
          flutter pub get
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/compileSdkVersion 31/compileSdkVersion 36/g; s/compileSdk 31/compileSdk 36/g' {} + || true
          flutter build appbundle --release
          zip -d build/app/outputs/bundle/release/app-release.aab "META-INF/*" || true
          ALIAS=$(keytool -list -v -keystore ../voice_et_release.jks -storepass VoiceET2026 | grep "Alias name:" | head -n 1 | awk -F': ' '{print $2}')
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ../voice_et_release.jks -storepass VoiceET2026 -keypass VoiceET2026 build/app/outputs/bundle/release/app-release.aab "$ALIAS"

      - name: Publish Play Store AAB to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v3.0.6 -y || true
          gh release create v3.0.6 jimma_voice_app/build/app/outputs/bundle/release/app-release.aab --title "Voice Chat ET v3.0.6 (Version 9)" --notes "Instant guest entry with 5,000 free welcome coins and 3D real games hub"
