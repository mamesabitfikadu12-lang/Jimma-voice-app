name: Build Ethio Voice Android APK & Play Store AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure App Name, ZegoVoice & Build
        run: |
          cd jimma_voice_app
          flutter create --org com.jimmavoice --project-name app .
          for d in android/app/src/main/res/mipmap-*; do cp ../voice_et_icon_512.png "$d/ic_launcher.png" 2>/dev/null || true; done
          mkdir -p assets/sounds
          printf "RIFF$\x00\x00\x00WAVEfmt \x10\x00\x00\x00\x01\x00\x01\x00D\xac\x00\x00\x88X\x01\x00\x02\x00\x10\x00data\x00\x00\x00\x00" > assets/sounds/coin.wav
          cp assets/sounds/coin.wav assets/sounds/gift.wav
          cp assets/sounds/coin.wav assets/sounds/win.wav
          cp assets/sounds/coin.wav assets/sounds/notify.wav
          printf "name: jimma_voice_app\ndescription: Voice Chat ET Official App\npublish_to: 'none'\nversion: 3.5.0+12\nenvironment:\n  sdk: '>=3.0.0 <4.0.0'\ndependencies:\n  flutter:\n    sdk: flutter\n  http: ^1.2.1\n  shared_preferences: ^2.2.3\n  image_picker: ^1.1.2\n  audioplayers: ^6.0.0\n  permission_handler: ^11.3.1\n  socket_io_client: ^2.0.3+1\n  webview_flutter: ^4.8.0\n  zego_express_engine: ^3.14.0\nflutter:\n  uses-material-design: true\n  assets:\n    - assets/sounds/\n" > pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="Voice Chat ET"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android {/android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' android/app/build.gradle.kts || true
          flutter pub get
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/compileSdkVersion 31/compileSdkVersion 36/g; s/compileSdk 31/compileSdk 36/g' {} + || true
          flutter build appbundle --release --build-number=17 --build-name=3.5.0
          zip -d build/app/outputs/bundle/release/app-release.aab "META-INF/*" || true
          ALIAS=$(keytool -list -v -keystore ../voice_et_release.jks -storepass VoiceET2026 | grep "Alias name:" | head -n 1 | awk -F': ' '{print $2}')
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ../voice_et_release.jks -storepass VoiceET2026 build/app/outputs/bundle/release/app-release.aab "$ALIAS"

      - name: Publish Play Store AAB to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v3.5.0 -y || true
          gh release create v3.5.0 jimma_voice_app/build/app/outputs/bundle/release/app-release.aab --title "Voice Chat ET v3.5.0 (Version 17)" --notes "Added 25+ 3D Sud.Tech multiplayer games, full Hala-style Me menu (Task Center, Host Tasks, Events, Wealth & Charm Levels, Host Center), Official Coin Sellers directory, and In-App Agency & Payroll"
